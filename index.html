<!DOCTYPE html>
<html>
<head>
<title>My Calculator</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: #e8eaff;
    padding: 50px;
}
.box {
    background: white;
    padding: 30px;
    max-width: 350px;
    margin: auto;
    border-radius: 15px;
}
input {
    padding: 12px;
    margin: 10px;
    width: 80%;
}
button {
    padding: 12px 20px;
    margin: 5px;
    background: blue;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>
</head>
<body>

<div class="box">
<h1>My Calculator</h1>

<input type="number" id="n1" placeholder="First Number">
<input type="number" id="n2" placeholder="Second Number">

<br>
<button onclick="calculate('+')">Add (+)</button>
<button onclick="calculate('-')">Subtract (-)</button>
<button onclick="calculate('*')">Multiply (*)</button>
<button onclick="calculate('/')">Divide (/)</button>

<h3 id="result">Result:</h3>
</div>

<script>
function add(a,b) { return a+b; }
function subtract(a,b) { return a-b; }
function multiply(a,b) { return a*b; }
function divide(a,b) { return a/b; }

function calculate(op) {
    let a = document.getElementById("n1").value;
    let b = document.getElementById("n2").value;
    let result;

    if(a === "" || b === "") {
        result = "Please enter both numbers";
    }
    else {
        a = Number(a);
        b = Number(b);

        if(op === '+') result = add(a,b);
        else if(op === '-') result = subtract(a,b);
        else if(op === '*') result = multiply(a,b);
        else if(op === '/') {
            result = b === 0 ? "Cannot divide by zero" : divide(a,b);
        }
    }

    document.getElementById("result").textContent = "Result: " + result;
}
</script>

</body>
</html>
